<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light" />
  <title>Studio</title>
  <meta name="description" content="Turn a topic into a finished, narrated 2D video." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Bangers&family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="top" id="top"></header>
    <div class="body" id="body">
      <nav class="side" id="rail" aria-label="Studio"></nav>
      <main class="stage" id="main" tabindex="-1"></main>
      <aside class="insp" id="insp" aria-label="Settings and actions">
        <div class="insp-body" id="inspBody"></div>
        <div class="insp-foot" id="inspFoot"></div>
      </aside>
      <aside class="drawer" id="feed" aria-label="Activity" hidden></aside>
    </div>
  </div>
  <script type="module" src="/ui/app.js"></script>
</body>
</html>
