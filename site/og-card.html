<!doctype html>
<!-- Source for assets/og.jpg (1200x630). Regenerate: see site/README.md. Not deployed (.vercelignore). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face { font-family: "Bricolage Grotesque"; font-weight: 200 800; src: url("assets/fonts/bricolage-grotesque.woff2") format("woff2"); }
    @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 400 600; src: url("assets/fonts/fraunces-italic.woff2") format("woff2"); }
    @font-face { font-family: "Geist Mono"; font-weight: 400 600; src: url("assets/fonts/geist-mono.woff2") format("woff2"); }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; color: #1f1b24; font-family: "Bricolage Grotesque", sans-serif;
      background: radial-gradient(700px 420px at 30% 0%, #ddd8ff, transparent 70%), radial-gradient(500px 360px at 90% 80%, #d4f0ff, transparent 70%), #f3f2fa;
    }
    .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(90,79,214,.16) 1px, transparent 1.4px); background-size: 24px 24px;
      -webkit-mask-image: radial-gradient(60% 70% at 30% 40%, #000 30%, transparent 75%); }
    .copy { position: absolute; left: 70px; top: 70px; width: 660px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
    .mark { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(140deg, #8076f2, #5a4fd6 55%, #3f35b0); }
    .brand em, h1 em { font-family: "Fraunces", serif; font-style: italic; font-weight: 500; color: #5a4fd6; }
    h1 { margin: 44px 0 0; font-size: 84px; line-height: 1; letter-spacing: -0.04em; font-weight: 700; }
    h1 .p { color: #5a4fd6; }
    p { margin: 26px 0 0; font-size: 26px; line-height: 1.35; color: #5f5a66; max-width: 560px; }
    .cta { position: absolute; left: 70px; bottom: 56px; display: inline-flex; align-items: center; gap: 12px; padding: 18px 28px; border-radius: 999px; color: #fff;
      font-size: 26px; font-weight: 700; letter-spacing: -0.01em; background: linear-gradient(135deg, #8076f2, #5a4fd6 45%, #3f35b0); box-shadow: 0 18px 40px -10px rgba(90,79,214,.65); }
    .cta small { font: 500 14px/1 "Geist Mono", monospace; letter-spacing: .04em; opacity: .85; text-transform: uppercase; }
    .phone { position: absolute; right: 90px; top: 46px; width: 250px; height: 538px; border-radius: 36px; padding: 8px; background: #111018; transform: rotate(4deg);
      box-shadow: 0 30px 60px -20px rgba(42,35,120,.55); }
    .phone img { width: 100%; height: 100%; object-fit: cover; border-radius: 29px; display: block; }
    .chip { position: absolute; right: 270px; top: 120px; z-index: 2; font: 500 15px/1 "Geist Mono", monospace; background: #fff; border-radius: 999px; padding: 12px 16px;
      box-shadow: 0 12px 30px -12px rgba(90,79,214,.4); display: flex; gap: 10px; align-items: center; }
    .chip i { width: 10px; height: 10px; border-radius: 50%; background: #26d478; }
  </style>
</head>
<body>
  <div class="dots"></div>
  <div class="copy">
    <div class="brand"><span class="mark"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M9 7.2 L17.4 12 L9 16.8 Z" fill="#fff"/></svg></span>Studio <em>Gen</em></div>
    <h1>One sentence <span class="p">in.</span><br />A finished <em>short</em> out.</h1>
    <p>Ideas, script, storyboard, voice and render, on your own computer.</p>
  </div>
  <div class="cta">Free on GitHub <small>→</small></div>
  <div class="chip"><i></i>Claude connected</div>
  <div class="phone"><img src="assets/hero-poster.jpg" alt="" /></div>
</body>
</html>
